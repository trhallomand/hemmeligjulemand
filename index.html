<!doctype html>
<html lang="is">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dulni jólasveinninn</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #fff;
      }
      body {
        min-height: 100vh;
        background: linear-gradient(to bottom, #991b1b, #b91c1c, #14532d);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
        overflow-x: hidden;
        position: relative;
      }
      .snow {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .flake {
        position: absolute;
        top: -40px;
        color: #fff;
        user-select: none;
        animation: fall linear infinite;
      }
      @keyframes fall {
        from { transform: translateY(-5vh) rotate(0deg); }
        to { transform: translateY(110vh) rotate(360deg); }
      }
      header { text-align: center; margin-bottom: 32px; position: relative; z-index: 1; }
      header .tree { font-size: 48px; }
      header h1 {
        margin-top: 8px;
        font-size: clamp(28px, 6vw, 38px);
        font-weight: 800;
        letter-spacing: -0.02em;
        text-shadow: 0 2px 8px rgba(0,0,0,0.3);
      }
      header p { margin-top: 8px; color: rgba(255,255,255,0.85); font-size: 17px; }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        width: 100%;
        max-width: 420px;
        position: relative;
        z-index: 1;
      }
      .name-btn {
        border: 1px solid rgba(252,165,165,0.4);
        background: rgba(255,255,255,0.95);
        color: #991b1b;
        font-size: 18px;
        font-weight: 600;
        padding: 20px 16px;
        border-radius: 16px;
        cursor: pointer;
        box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        transition: transform 0.15s ease, background 0.15s ease;
        animation: pop 0.4s ease both;
      }
      .name-btn:hover { background: #fef2f2; transform: scale(1.04); }
      .name-btn:active { transform: scale(0.96); }
      @keyframes pop {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .link-btn {
        margin-top: 20px;
        background: none;
        border: none;
        color: rgba(255,255,255,0.8);
        font-size: 14px;
        text-decoration: underline;
        text-underline-offset: 4px;
        cursor: pointer;
        position: relative;
        z-index: 1;
      }
      .link-btn:hover { color: #fff; }
      .question { font-size: 19px; font-weight: 600; margin-bottom: 20px; z-index: 1; position: relative; }
      .card {
        background: rgba(255,255,255,0.95);
        color: #991b1b;
        border-radius: 16px;
        padding: 24px;
        text-align: center;
        max-width: 380px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        position: relative;
        z-index: 1;
      }
      .card h2 { font-size: 18px; }
      .card .sub { font-size: 14px; color: rgba(153,27,27,0.8); margin-top: 4px; }
      .gift {
        font-size: 72px;
        background: rgba(255,255,255,0.1);
        border: none;
        border-radius: 24px;
        padding: 32px 40px;
        cursor: pointer;
        box-shadow: 0 25px 50px rgba(0,0,0,0.35);
        backdrop-filter: blur(4px);
        animation: wiggle 1.6s ease-in-out infinite;
        z-index: 1;
        position: relative;
      }
      @keyframes wiggle {
        0%, 100% { transform: rotate(0deg); }
        20% { transform: rotate(-4deg); }
        40% { transform: rotate(4deg); }
        60% { transform: rotate(-3deg); }
        80% { transform: rotate(3deg); }
      }
      .reveal {
        background: #fff;
        border: 4px solid #fde047;
        border-radius: 24px;
        padding: 32px 32px;
        text-align: center;
        box-shadow: 0 25px 50px rgba(0,0,0,0.35);
        animation: springIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        position: relative;
        z-index: 1;
      }
      @keyframes springIn {
        from { transform: scale(0.4) rotate(-10deg); opacity: 0; }
        to { transform: scale(1) rotate(0deg); opacity: 1; }
      }
      .reveal .label {
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #b91c1c;
      }
      .reveal .person {
        margin-top: 8px;
        font-size: 36px;
        font-weight: 800;
        color: #166534;
      }
      .reveal .party { margin-top: 12px; font-size: 24px; }
      .hint {
        margin-top: 24px;
        max-width: 300px;
        text-align: center;
        font-size: 14px;
        color: rgba(255,255,255,0.85);
        animation: fade 0.5s ease 0.4s both;
        position: relative;
        z-index: 1;
      }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      .fade-in { animation: fade 0.4s ease both; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div class="snow" id="snow"></div>

    <header id="header">
      <div class="tree">🎄</div>
      <h1>Dulni jólasveinninn</h1>
      <p>Hó hó hó! Finndu út hver þú átt að gleðja þessi jólin.</p>
    </header>

    <!-- Pick view -->
    <div id="pick-view" style="display:flex;flex-direction:column;align-items:center;position:relative;z-index:1;">
      <p class="question">Hver ert þú?</p>
      <div class="grid" id="name-grid"></div>
      <div class="card hidden" id="all-drawn">
        <h2>Allir á þessu tæki hafa dregið! 🎁</h2>
        <p class="sub">Munaðir ekki hverja þú fékkst? Skoðaðu hér fyrir neðan.</p>
      </div>
      <button class="link-btn" id="toggle-lookup">Hefur þú nú þegar dregið? Sjáðu hverja þú fékkst</button>
    </div>

    <!-- Reveal view -->
    <div id="reveal-view" class="hidden" style="display:flex;flex-direction:column;align-items:center;position:relative;z-index:1;">
      <p class="question" id="reveal-question"></p>
      <button class="gift" id="gift" aria-label="Opna gjöfina">🎁</button>
      <div class="reveal hidden" id="reveal-card">
        <div class="label">Gjöfin þín fer til</div>
        <div class="person" id="person"></div>
        <div class="party">🎉🎅✨</div>
      </div>
      <p class="hint hidden" id="hint">Haltu þessu leyndu! 🤫 Taktu skjáskot ef þú þarft að muna eftir þessu.</p>
      <button class="link-btn" id="done-btn">Búið</button>
    </div>

    <script>
      /* ============================================================
         CONFIG - the names and the pre-drawn assignments.
         ============================================================ */
      var SISTERS = ["Fjóla", "Magnea", "Anna", "Huldis", "Linda", "Freya"];

      // Obfuscated pre-drawn assignments (nobody draws themselves)
      var SECRET_KEY = "yaa9xE3s4QpWnjc5";
      var PAYLOAD =
        "0002004300270053008b002900520051000e0073003100390000000b00410019005b002c0000005e0016002000520051000e0073003c003e0000000e000200170055004300200057001600240011004900160017001a00a40002000b00410019005b002900140055001c002c00400051000e0073003d00360009000400060054005b004d004300750011002b005700120016006b00520011001c000f001a0054005b004d0043007f000a0020004a00120016006b0052001f001b00060007005c000a0043001c";

      function decodeAssignments() {
        var json = "";
        for (var i = 0; i < PAYLOAD.length; i += 4) {
          var x = parseInt(PAYLOAD.slice(i, i + 4), 16);
          json += String.fromCharCode(
            x ^ SECRET_KEY.charCodeAt((i / 4) % SECRET_KEY.length)
          );
        }
        return JSON.parse(json);
      }

      var STORAGE_KEY = "santa-drawn-v1";

      function getDrawn() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        } catch (e) {
          return [];
        }
      }

      function markDrawn(name) {
        var drawn = getDrawn();
        if (drawn.indexOf(name) === -1) {
          drawn.push(name);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(drawn));
        }
      }

      /* ---------- Snow ---------- */
      (function makeSnow() {
        var snow = document.getElementById("snow");
        for (var i = 0; i < 28; i++) {
          var f = document.createElement("div");
          f.className = "flake";
          f.textContent = "❄";
          f.style.left = Math.random() * 100 + "%";
          f.style.fontSize = 10 + Math.random() * 16 + "px";
          f.style.opacity = 0.25 + Math.random() * 0.45;
          f.style.animationDuration = 7 + Math.random() * 8 + "s";
          f.style.animationDelay = -Math.random() * 8 + "s";
          snow.appendChild(f);
        }
      })();

      var assignments = decodeAssignments();
      var lookupMode = false;

      var pickView = document.getElementById("pick-view");
      var revealView = document.getElementById("reveal-view");
      var nameGrid = document.getElementById("name-grid");
      var allDrawn = document.getElementById("all-drawn");
      var toggleLookup = document.getElementById("toggle-lookup");
      var revealQuestion = document.getElementById("reveal-question");
      var gift = document.getElementById("gift");
      var revealCard = document.getElementById("reveal-card");
      var person = document.getElementById("person");
      var hint = document.getElementById("hint");
      var doneBtn = document.getElementById("done-btn");
      var header = document.getElementById("header");

      function renderGrid() {
        var drawn = getDrawn();
        var available = lookupMode
          ? SISTERS
          : SISTERS.filter(function (s) { return drawn.indexOf(s) === -1; });
        nameGrid.innerHTML = "";
        allDrawn.classList.toggle("hidden", available.length > 0);
        available.forEach(function (name, i) {
          var btn = document.createElement("button");
          btn.className = "name-btn";
          btn.textContent = name;
          btn.style.animationDelay = i * 0.06 + "s";
          btn.addEventListener("click", function () {
            choose(name);
          });
          nameGrid.appendChild(btn);
        });
      }

      function choose(name) {
        if (!lookupMode) markDrawn(name);
        revealQuestion.textContent =
          "Góðan daginn " + name + "! Þú átt að gefa gjöf til...";
        person.textContent = assignments[name] || "?";
        gift.classList.remove("hidden");
        revealCard.classList.add("hidden");
        hint.classList.add("hidden");
        pickView.classList.add("hidden");
        revealView.classList.remove("hidden");
        revealView.classList.add("fade-in");
      }

      function reset() {
        lookupMode = false;
        toggleLookup.textContent = "Hefur þú nú þegar dregið? Sjáðu hverja þú fékkst";
        revealView.classList.add("hidden");
        pickView.classList.remove("hidden");
        renderGrid();
      }

      gift.addEventListener("click", function () {
        gift.classList.add("hidden");
        revealCard.classList.remove("hidden");
        hint.classList.remove("hidden");
      });

      doneBtn.addEventListener("click", reset);

      toggleLookup.addEventListener("click", function () {
        lookupMode = !lookupMode;
        toggleLookup.textContent = lookupMode
          ? "Til baka í uppdraftinn"
          : "Hefur þú nú þegar dregið? Sjáðu hverja þú fékkst";
        renderGrid();
      });

      renderGrid();
    </script>
  </body>
</html>
